
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clientes | Assistência Técnica</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="dashboard-body">

    <div class="dashboard-container">

        <aside class="sidebar">

            <div class="sidebar-header">
                <h2>Assistência Técnica</h2>
                <p>Sistema de gerenciamento</p>
            </div>

            <nav class="sidebar-nav">
                <a href="{{ url_for('index') }}" class="nav-link">
                    Início
                </a>

                <a href="{{ url_for('clientes') }}" class="nav-link active">
                    Clientes
                </a>

                <a href="#" class="nav-link">
                    Serviços
                </a>
            </nav>

            <div class="sidebar-footer">
                <a href="{{ url_for('login') }}" class="nav-link">
                    Sair do sistema
                </a>
            </div>

        </aside>

        <main class="dashboard-content">

            <header class="dashboard-header">
                <div>
                    <h1>Clientes</h1>
                    <p>Cadastre e consulte os clientes da assistência técnica.</p>
                </div>
            </header>

            <section class="dashboard-section">

                <h2>Cadastrar novo cliente</h2>

                <div class="client-form-card">

                    <form action="#" method="POST">

                        <div class="form-group">
                            <label for="nome">Nome completo</label>

                            <input
                                type="text"
                                id="nome"
                                name="nome"
                                placeholder="Digite o nome do cliente"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="telefone">Telefone</label>

                            <input
                                type="tel"
                                id="telefone"
                                name="telefone"
                                placeholder="(00) 00000-0000"
                                required
                            >
                        </div>

                        <button type="submit" class="login-button">
                            Cadastrar cliente
                        </button>

                    </form>

                </div>

            </section>

            <section class="dashboard-section">

                <h2>Consultar clientes</h2>

                <div class="client-search-card">

                    <div class="form-group">
                        <label for="pesquisa">Pesquisar cliente</label>

                        <input
                            type="search"
                            id="pesquisa"
                            name="pesquisa"
                            placeholder="Digite o nome ou telefone do cliente"
                        >
                    </div>

                    <button type="button" class="login-button">
                        Pesquisar
                    </button>

                </div>

            </section>

            <section class="dashboard-section">

                <h2>Clientes cadastrados</h2>

                <div class="client-table-card">

                    <table class="client-table">

                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Telefone</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr>
                                <td colspan="2" class="empty-message">
                                    Nenhum cliente cadastrado até o momento.
                                </td>
                            </tr>
                        </tbody>

                    </table>

                </div>

            </section>

        </main>

    </div>

</body>
</html>
