<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Assistência Técnica</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="login-body">

    <main class="login-container">

        <header class="login-header">
            <h1>Assistência Técnica</h1>
            <p>Organize seus clientes e serviços</p>
        </header>

        <div class="login-tabs">
            <button type="button" class="login-tab active" id="aba-entrar" onclick="mostrarAba('entrar')">
                Entrar
            </button>

            <button type="button" class="login-tab" id="aba-cadastrar" onclick="mostrarAba('cadastrar')">
                Cadastrar
            </button>
        </div>

        {% with mensagens = get_flashed_messages(category_filter=["login"]) %}
            {% if mensagens %}
                <div class="login-messages">
                    {% for mensagem in mensagens %}
                        <p>{{ mensagem }}</p>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" id="form-entrar">

            <div class="form-group">
                <label for="usuario">Usuário</label>
                <input type="text" id="usuario" name="usuario" required>
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" required>
            </div>

            <button type="submit" class="login-button">Entrar</button>

        </form>

        <form method="POST" id="form-cadastrar" class="form-hidden">

            <div class="form-group">
                <label for="novo_usuario">Usuário</label>
                <input type="text" id="novo_usuario" name="novo_usuario" required>
            </div>

            <div class="form-group">
                <label for="nova_senha">Senha</label>
                <input type="password" id="nova_senha" name="nova_senha" minlength="8" required>
            </div>

            <div class="form-group">
                <label for="confirmar_senha">Confirmar senha</label>
                <input type="password" id="confirmar_senha" name="confirmar_senha" minlength="8" required>
            </div>

            <button type="submit" class="login-button">Cadastrar</button>

        </form>

    </main>

    <script>
        function mostrarAba(aba) {
            const formEntrar = document.getElementById("form-entrar");
            const formCadastrar = document.getElementById("form-cadastrar");
            const abaEntrar = document.getElementById("aba-entrar");
            const abaCadastrar = document.getElementById("aba-cadastrar");

            if (aba === "entrar") {
                formEntrar.classList.remove("form-hidden");
                formCadastrar.classList.add("form-hidden");

                abaEntrar.classList.add("active");
                abaCadastrar.classList.remove("active");
            } else {
                formEntrar.classList.add("form-hidden");
                formCadastrar.classList.remove("form-hidden");

                abaEntrar.classList.remove("active");
                abaCadastrar.classList.add("active");
            }
        }
    </script>

</body>
</html>
